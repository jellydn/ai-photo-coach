name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn test --ci --runInBand

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint

  adr-check:
    name: ADR required for architectural changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an ADR when a recorded seam changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Recorded seams (each has an ADR in .planning/adr/). Keep in sync
          # with CONVENTIONS.md -> Architectural Conventions -> ADR Requirement.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)"
          touched_seam="$(printf '%s\n' "$changed" | grep -E '^(src/scoring/(useScoring|types)\.ts|src/shotAnalysis/|src/storage/(storageWiring|PhotoStorage)\.ts|src/screens/usePhotoReview\.ts|src/framePipeline/|src/capture/countdownTimer\.ts|src/camera/useCameraSettings\.ts|src/telemetry/)' || true)"
          added_adr="$(printf '%s\n' "$changed" | grep -cE '^\.planning/adr/[0-9]+-' || true)"
          if [ -n "$touched_seam" ] && [ "$added_adr" -eq 0 ]; then
            echo "::error::Architectural seam(s) changed without an ADR. Add a record to .planning/adr/ (copy adr-template.md, see CONVENTIONS.md)."
            printf '%s\n' "$touched_seam"
            exit 1
          fi
          echo "ADR check passed"

  adr-index:
    name: ADR index is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate ADR index from .planning/adr/
        run: yarn adr:index
      - name: Fail if website/index.html is stale
        run: git diff --exit-code -- website/index.html

  dead-export-check:
    name: No new dead exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail on dead exports beyond the baseline
        run: yarn dead:check

  # Two dead-export guards, complementary:
  #   dead-export-check  — baseline guard: fails anything beyond the committed
  #                       baseline. Bypassable only by regenerating the baseline.
  #   dead-export-pr     — base-diff guard (this one): fails dead exports OR
  #                       Category C test-only exports the PR actually
  #                       introduced vs its merge-base. Not bypassable.
  dead-export-pr:
    name: No new dead or test-only exports vs base
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail when the PR introduces dead or test-only exports
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Diff the dead-export and test-only sets at HEAD against the
          # merge-base, so a PR that adds a new zero-caller export OR a new
          # Category C test-only export (consumed only by __tests__) fails even
          # if the committed baseline was regenerated. Using the merge-base
          # (not the base tip) avoids false positives on stale branches that
          # still carry exports already resolved on main. Mirrors adr-check's
          # three-dot diff semantics. See .planning/category-c-verdicts.md.
          set -euo pipefail
          cleanup() { git worktree remove --force /tmp/dead-base >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          node scripts/dead-export-check.mjs --no-baseline --json --exit-0 \
            > /tmp/dead-head.json
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git worktree add --detach /tmp/dead-base "$MERGE_BASE"
          node scripts/dead-export-check.mjs --no-baseline --json --exit-0 \
            --root /tmp/dead-base > /tmp/dead-base.json
          # Comparison logic lives in the script (--diff), so the guard has
          # a single source of truth instead of inline node -e.
          node scripts/dead-export-check.mjs --diff /tmp/dead-head.json /tmp/dead-base.json
